<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Search - Car Rental System</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url("background.png") no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }

    nav {
      background-color: #022454;
      padding: 15px 0;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      margin: 0;
    }

    nav ul li {
      flex: 1;
      text-align: center;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 12px 20px;
      transition: background 0.3s;
    }

    nav ul li a:hover {
      background-color: #575757;
    }

    .card {
      background-color: #ffffff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .form-control,
    .form-select {
      height: 45px;
      border-radius: 8px;
      border: 1px solid #002454;
    }

    .btn {
      height: 45px;
      border-radius: 8px;
      color: #ffffff;
      background-color: #022454;
    }

    .card-container {
      max-width: 500px;
      margin: 80px auto;
    }

    h3 {
      text-align: center;
      margin-bottom: 20px;
      color: #022454;
    }

    footer {
      background-color: #022454;
      padding: 10px;
      color: white;
      text-align: center;
      position: fixed;
      width: 100%;
      bottom: 0;
    }

    /* For AJAX loading spinner */
    .spinner {
      display: none;
      margin-top: 20px;
      text-align: center;
    }

    /* Styling for the search results container */
    .results-container {
      max-width: 800px;
      margin: 50px auto;
      background-color: #ffffff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      color: #343a40;
    }

    .result-item {
      margin-bottom: 20px;
    }

    .result-item img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <!-- Navigation Bar -->
  <nav>
    <ul>
      <li><a href="admin_home.php">Home</a></li>
      <li><a href="manage.php">Manage Customers</a></li>
      <li><a href="manage_cars.html">Manage Cars</a></li>
      <li><a href="generate_reports.php">Reports</a></li>
      <li><a href="admin_search.html">Search</a></li>
      <li><a href="menu.html">Logout</a></li>
    </ul>
  </nav>

  <div class="card-container">
    <div class="card">
      <h3>Admin Search for Cars</h3>
      <form id="admin-search-form" method="GET">
        <div class="mb-3">
          <select name="class" class="form-select">
            <option value="">Select Class</option>
            <option value="Luxury">Luxury</option>
            <option value="Compact">Compact</option>
            <option value="SUV">SUV</option>
            <option value="Truck">Truck</option>
          </select>
        </div>
        <div class="mb-3">
          <input type="text" name="model" class="form-control" placeholder="Model">
        </div>
        <div class="mb-3">
          <input type="number" id="year" name="year" class="form-control" placeholder="Year">
        </div>
        <div class="mb-3">
          <input type="text" name="color" class="form-control" placeholder="Color">
        </div>
        <div class="mb-3">
          <input type="text" name="brand" class="form-control" placeholder="Brand">
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Search</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Spinner for loading -->
  <div id="loadingSpinner" class="spinner">
    <div class="spinner-border text-light" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div id="searchResults" class="results-container"></div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    // Set the year input's min and max values
    document.addEventListener("DOMContentLoaded", () => {
      const yearInput = document.getElementById("year");
      const currentYear = new Date().getFullYear();
      yearInput.setAttribute("max", currentYear);
      yearInput.setAttribute("min", currentYear - 10);
    });

    // Handle form submission with AJAX
    $('#admin-search-form').on('submit', function (e) {
      e.preventDefault(); // Prevent normal form submission

      const formData = $(this).serialize(); // Serialize the form data
      $('#loadingSpinner').show(); // Show loading spinner

      $.ajax({
        url: 'admin_car_search.php',
        method: 'GET',
        data: formData,
        success: function (response) {
          $('#loadingSpinner').hide(); // Hide loading spinner
          $('#searchResults').html(response); // Display search results
        },
        error: function () {
          $('#loadingSpinner').hide(); // Hide loading spinner
          $('#searchResults').html('<p class="text-danger">An error occurred. Please try again.</p>');
        }
      });
    });
  </script>

  <footer>
    &copy; 2024 Car Rental System. All Rights Reserved.
  </footer>
</body>

</html>
