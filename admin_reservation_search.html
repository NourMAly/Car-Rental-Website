<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      background: url("background.png") no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      font-family: "Arial", sans-serif;
    }

    nav {
      background-color: #022454;
      padding: 10px 0;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      margin: 0;
    }

    nav ul li {
      flex: 1;
      text-align: center;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 12px 20px;
      transition: background 0.3s;
    }

    nav ul li a:hover {
      background-color: #575757;
    }

    .card-container {
      max-width: 800px;
      margin: 50px auto;
      background-color: #ffffff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    h3 {
      text-align: center;
      margin-bottom: 30px;
      color: #022454;
    }

    h5 {
      color: #000;
      font-weight: bold;
      margin-top: 20px;
    }

    label {
      font-weight: bold;
      color: #022454;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      text-align: center;
      background-color: #002952;
      border: none;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.4s ease;
      text-decoration: none;
    }

    .btn:hover {
      background-color: #00509e;
      color: #ffffff;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
      transform: translateY(-3px);
    }

    footer {
      background-color: #022454;
      padding: 10px;
      color: white;
      text-align: center;
      position: fixed;
      width: 100%;
      bottom: 0;
    }
    .results-container {
  max-width: 1200px; /* Maximum width to prevent overflow */
  margin: 50px auto; /* Centering the container horizontally with some top and bottom margin */
  background-color: #fff; /* White background for the container */
  border-radius: 20px; /* Rounded corners */
  padding: 30px; /* Padding inside the container */
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2); /* Subtle shadow effect */
  overflow-x: auto; /* Allow horizontal scrolling if needed */
}
.no-results-message {
    color: #022454; /* Red color for visibility */
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    margin-top: 20px;
}

  </style>
</head>

<body>
  <nav>
    <ul>
      <li><a href="admin_home.php">Home</a></li>
      <li><a href="manage.php">Manage Customers</a></li>
      <li><a href="manage_cars.html">Manage Cars</a></li>
      <li><a href="generate_reports.php">Reports</a></li>
      <li><a href="admin_search.html">Search</a></li>
      <li><a href="menu.html">Logout</a></li>
    </ul>
  </nav>

  <div class="card-container">
    <h3>Search Rent</h3>
    <form id="searchForm">
      <!-- Car Attributes -->
      <h5>Car Information</h5>
      <div class="mb-3">
        <label for="plate_id" class="form-label">Plate ID</label>
        <input type="text" class="form-control" id="plate_id" name="plate_id" placeholder="Enter Plate ID">
      </div>
      <div class="mb-3">
        <label for="brand" class="form-label">Brand</label>
        <input type="text" class="form-control" id="brand" name="brand" placeholder="Enter Brand">
      </div>
      <div class="mb-3">
        <label for="model" class="form-label">Model</label>
        <input type="text" class="form-control" id="model" name="model" placeholder="Enter Model">
      </div>
      <div class="mb-3">
        <label for="year" class="form-label">Year</label>
        <input type="text" class="form-control" id="year" name="year" placeholder="Enter Year">
      </div>
      <div class="mb-3">
        <label for="color" class="form-label">Color</label>
        <input type="text" class="form-control" id="color" name="color" placeholder="Enter Color">
      </div>
      <div class="mb-3">
        <label for="class" class="form-label">Class</label>
        <input type="text" class="form-control" id="class" name="class" placeholder="Enter Class">
      </div>

      <!-- Customer Attributes -->
      <h5>Customer Information</h5>
      <div class="mb-3">
        <label for="fname" class="form-label">First Name</label>
        <input type="text" class="form-control" id="fname" name="fname" placeholder="Enter First Name">
      </div>
      <div class="mb-3">
        <label for="lname" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="lname" name="lname" placeholder="Enter Last Name">
      </div>
      <div class="mb-3">
        <label for="ssn" class="form-label">SSN</label>
        <input type="text" class="form-control" id="ssn" name="ssn" placeholder="Enter SSN">
      </div>
      <div class="mb-3">
        <label for="gender" class="form-label">Gender</label>
        <select class="form-select" id="gender" name="gender">
          <option value="" selected>Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>

      <!-- Rent Attributes -->
      <h5>Rent Information</h5>
      <div class="mb-3">
        <label for="pickup" class="form-label">Pickup Date</label>
        <input type="date" class="form-control" id="pickup" name="pickup">
      </div>
      <div class="mb-3">
        <label for="return" class="form-label">Return Date</label>
        <input type="date" class="form-control" id="return" name="return">
      </div>
      <div class="mb-3">
        <label for="payment" class="form-label">Payment Amount (in $)</label>
        <input type="number" class="form-control" id="payment" name="payment" placeholder="Enter Payment Amount in $">
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn">Search</button>
    </form>
  </div>
    <div id="searchResults" class="results-container">
      <!-- Results will be displayed here -->
    </div>

  <footer>
    &copy; 2024 Car Rental System. All Rights Reserved.
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    $(document).ready(function() {
      $('#searchForm').submit(function(event) {
        event.preventDefault(); // Prevent form from submitting normally

        var formData = $(this).serialize(); // Serialize form data

        $.ajax({
          url: 'admin_reservation_search.php', // The PHP file that processes the search
          type: 'GET',
          data: formData, // Send the form data
          success: function(response) {
            $('#searchResults').html(response); // Update the results container with the response
          },
          error: function(xhr, status, error) {
            alert("An error occurred: " + error);
          }
        });
      });
    });
  </script>
</body>

</html>
