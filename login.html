<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Login Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <style>
    /* Background gradient */
    body {
      background: url("background.png") no-repeat center center fixed;
      background-size: cover;
    }

    nav {
      background-color: #022454;
      padding: 10px 0;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      margin: 0;
    }

    nav ul li {
      flex: 1;
      text-align: center;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      display: block;
      padding: 10px;
      transition: background 0.3s;
    }

    nav ul li a:hover {
      background-color: #575757;
    }

    /* Card styling */
    .card {
      background: #ffffff;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    /* Header color */
    .card h2 {
      color: #002454;
    }

    /* Input fields */
    .form-control {
      border: 1px solid #002454;
      border-radius: 8px;
    }

    /* Focus effect for inputs */
    .form-control:focus {
      box-shadow: 0 0 5px #002454;
      border-color: #002454;
    }

    /* Login button */
    .btn-primary {
      background-color: #002454;
      border: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .btn-primary:hover {
      background-color: #002454;
    }

    /* Register link */
    .text-decoration-none {
      color: #228ffb;
    }

    .text-decoration-none:hover {
      text-decoration: underline;
    }
    footer {
            background-color: #022454;
            padding: 10px;
            color: white;
            text-align: center;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
  </style>
</head>

<body>
  <nav>
    <ul>
      <li><a href="menu.html">Home</a></li>
      <li><a href="aboutus.html">About</a></li>
      <li><a href="contactus.html">Contact Us</a></li>
      <li><a href="location.html">Locations</a></li>
      <li><a href="signup.html">Sign-up</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>
  <div class="d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow-sm" style="width: 22rem;">
      <div class="card-body">
        <h2 class="text-center mb-4">Login</h2>
        <form action="login.php" method="POST">
          <div class="mb-3">
            <label for="loginType" class="form-label">Login Type</label>
            <select class="form-control" id="loginType" name="loginType" required>
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="username" class="form-label">Email</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your email"
              required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password"
              required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
          <p class="text-center mt-3">
            Don't have an account? <a href="signup.html" class="text-decoration-none">Register
              here</a>
          </p>
        </form>
      </div>
    </div>
  </div>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <footer>
    &copy; 2024 Car Rental System. All Rights Reserved.
</footer>
</body>

</html>
