        table {

        table th, table td {

<body>

        <ul>

    <!-- Main Content -->
    <div class="container">
        <h1>Manage Cars</h1>
        <form action="display_cars.php" method="POST">
            <button type="submit">Display Cars</button>
        </form>


        <!-- Add New Car Form -->
        <div class="form-container">
            <form action="add_car.php" method="POST" enctype="multipart/form-data">
                <h2>Add New Car</h2>
                <label for="plate_id">Plate ID:</label>
                <input type="text" id="plate_id" name="plate_id" required>

                <label for="model">Model:</label>
                <input type="text" id="model" name="model" required>

                <label for="year">Year:</label>
                <input type="number" id="year" name="year" required>

                <label for="color">Color:</label>
                <input type="text" id="color" name="color" required>

                <label for="brand">Brand:</label>
                <input type="text" id="brand" name="brand" required>

                <label for="class">Class:</label>
                <input type="text" id="class" name="class" required>

                <label for="image">Image:</label>
                <input type="file" id="image" name="image" required>

                <label for="price">Price/Day:</label>
                <input type="number" id="price" name="price" required>

                <label for="office_no">Office No:</label>
                <input type="number" name="office_no" required><br>

                <label for="status">Status:</label>
                <select id="status" name="status" required>
                    <option value="Reserved">Reserved</option>
                    <option value="Available">Available</option>
                    <option value="Out_Of_Service">Out_Of_Service</option>
                </select>

                <button type="submit">Add Car</button>
            </form>

            <!-- Update Car Status Form -->
            <form action="update_status.php" method="POST">
                <h2>Update Car Status</h2>
                <label for="plate_id_update">Plate ID:</label>
                <input type="text" id="plate_id_update" name="plate_id" required>

                <label for="status_update">Status:</label>
                <select id="status_update" name="status" required>
                    <option value="Reserved">Reserved</option>
                    <option value="Available">Available</option>
                    <option value="Out_Of_Service">Out_Of_Service</option>
                </select>

                <button type="submit">Update Status</button>
            </form>
        </div>
    </div>
</body>
