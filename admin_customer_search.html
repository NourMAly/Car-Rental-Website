  <div class="card-container">
    <h3>Search Customers</h3>
    <form id="search-form" method="GET">
      <!-- SSN Field -->
      <div class="mb-3">
        <label for="ssn" class="form-label">SSN</label>
        <input type="text" class="form-control" id="ssn" name="ssn" placeholder="Enter SSN">
      </div>
      <!-- First Name Field -->
      <div class="mb-3">
        <label for="fname" class="form-label">First Name</label>
        <input type="text" class="form-control" id="fname" name="fname" placeholder="Enter First Name">
      </div>
      <!-- Last Name Field -->
      <div class="mb-3">
        <label for="lname" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="lname" name="lname" placeholder="Enter Last Name">
      </div>
      <!-- Gender Field -->
      <div class="mb-3">
        <label for="gender" class="form-label">Gender</label>
        <select class="form-select" id="gender" name="gender">
          <option value="" selected>Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>
      <!-- Email Field -->
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="Enter Email">
      </div>
      <!-- Phone Number Field -->
      <div class="mb-3">
        <label for="phone_no" class="form-label">Phone Number</label>
        <input type="text" class="form-control" id="phone_no" name="phone_no" placeholder="Enter Phone Number">
      </div>
      <!-- Submit Button -->
      <button type="submit" class="btn">Search</button>
    </form>
  </div>

  <div id="results-container"></div>

  <!-- jQuery and AJAX -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
  $(document).ready(function() {
    $('#search-form').on('submit', function(event) {
        event.preventDefault();  // Prevent form from submitting traditionally

        $.ajax({
            url: 'admin_customer_search.php',
            type: 'GET',
            data: $(this).serialize(),  // Serialize form data
            success: function(response) {
                // Inject the returned HTML content into the results container
                $('#results-container').html(response);
            },
            error: function() {
                alert('Error with the request');
            }
        });
    });
  });
  </script>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
